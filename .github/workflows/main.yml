
name: Generar APK de NENE

on:
  workflow_dispatch:
  push:
    paths:
      - 'NENE Android Proyecto.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extraer proyecto
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir proyecto
          unzip -q "NENE Android Proyecto.zip" -d proyecto

      - name: Compilar APK
        run: |
          GRADLEW=$(find proyecto -type f -name gradlew | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "No se encontró gradlew en el ZIP"
            exit 1
          fi
          cd "$(dirname "$GRADLEW")"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: NENE-APK
          path: proyecto/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
