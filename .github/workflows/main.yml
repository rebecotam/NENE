
name: Generar APK de NENE

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extraer proyecto
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir -p proyecto
          ZIP_FILE=$(find . -type f -iname '*.zip' -not -path './.git/*' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No se encontró el ZIP."
            exit 1
          fi
          unzip -o -q "$ZIP_FILE" -d proyecto

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          cd proyecto/NENE-Android-Proyecto
          gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: NENE-APK
          path: proyecto/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
